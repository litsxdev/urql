# List users with nullable address and company fields
query GetUsers($options: PageQueryOptions) {
  users(options: $options) {
    data {
      id
      name
      username
      email
      phone
      website
      company {
        name
        catchPhrase
      }
      address {
        city
        street
        zipcode
        geo {
          lat
          lng
        }
      }
    }
    meta {
      totalCount
    }
  }
}

# Fetch a single user with nested posts, albums and todos
query GetUser($id: ID!) {
  user(id: $id) {
    id
    name
    username
    email
    phone
    website
    company {
      name
      catchPhrase
      bs
    }
    address {
      street
      suite
      city
      zipcode
      geo {
        lat
        lng
      }
    }
    posts(options: { paginate: { page: 1, limit: 3 } }) {
      data {
        id
        title
      }
    }
    albums(options: { paginate: { page: 1, limit: 2 } }) {
      data {
        id
        title
      }
    }
    todos(options: { paginate: { page: 1, limit: 4 } }) {
      data {
        id
        title
        completed
      }
    }
  }
}

# Search posts with linked author and recent comments
query SearchPosts($options: PageQueryOptions) {
  posts(options: $options) {
    data {
      id
      title
      body
      user {
        id
        name
        username
      }
      comments(options: { paginate: { page: 1, limit: 2 } }) {
        data {
          id
          name
          email
        }
      }
    }
    meta {
      totalCount
    }
  }
}

# Explore albums with thumbnails
query GetAlbums($options: PageQueryOptions) {
  albums(options: $options) {
    data {
      id
      title
      user {
        id
        name
      }
      photos(options: { paginate: { page: 1, limit: 3 } }) {
        data {
          id
          title
          thumbnailUrl
        }
      }
    }
    meta {
      totalCount
    }
  }
}
